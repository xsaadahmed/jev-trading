repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.0
          - pydantic-settings>=2.0
          - pandas-stubs>=2.2
          - types-PyYAML>=6.0
          - sqlalchemy>=2.0
          - structlog>=24.0
          - numpy>=1.26
        args: [--config-file=pyproject.toml]
        pass_filenames: false

  - repo: local
    hooks:
      - id: secret-scan
        name: secret-scan
        entry: python -m pytest tests/unit/test_secret_scan.py -q
        language: system
        pass_filenames: false
        always_run: true
