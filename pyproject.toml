[project]
name = "jevlab"
version = "0.1.0"
description = "Jev trading research lab — controlled experiment measuring Jev incremental value"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "structlog>=24.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "plotly>=5.0",
    "exchange-calendars>=4.5",
    "pyyaml>=6.0",
    "zstandard>=0.22",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.0",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "types-requests>=2.0",
]

[project.scripts]
jev = "jevlab.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.0",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["jevlab"]

[[tool.mypy.overrides]]
module = [
    "exchange_calendars.*",
    "lightgbm.*",
    "plotly.*",
    "duckdb.*",
    "joblib",
    "joblib.*",
    "sklearn",
    "sklearn.*",
    "sklearn.*.*",
    "sklearn.*.*.*",
]
ignore_missing_imports = true
follow_untyped_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "statsmodels",
    "statsmodels.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "jevlab.models.logistic",
    "jevlab.models.gbm",
    "jevlab.models.pipelines",
    "jevlab.models.metrics",
    "jevlab.models.transforms",
    "jevlab.models.controls",
    "jevlab.models.column_sets",
    "jevlab.experiments.runner",
    "jevlab.experiments.manifest",
    "jevlab.backtest.ledger",
    "jevlab.backtest.fast",
    "jevlab.evaluation.metrics",
    "jevlab.evaluation.bootstrap",
    "jevlab.evaluation.predictive",
    "jevlab.evaluation.tests",
    "jevlab.evaluation.stats_summary",
    "jevlab.evaluation.placebo",
    "jevlab.evaluation.robustness",
    "jevlab.reporting.build_report",
    "jevlab.reporting.plots",
    "jevlab.reporting.conclusion",
    "jevlab.reporting.statements",
    "jevlab.experiments.acceptance",
    "jevlab.experiments.artifacts",
    "jevlab.jev.audit",
]
disable_error_code = ["no-untyped-call", "import-untyped", "index", "arg-type", "dict-item", "no-any-return", "unused-ignore", "misc", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "secret_scan: repository-wide secret pattern scan",
]
